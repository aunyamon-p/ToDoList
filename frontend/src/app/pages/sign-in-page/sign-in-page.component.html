<div class="relative bg-red-400 w-full h-screen">
    <img src="/assets/images/bg.png" alt="Background Image" class="absolute w-full h-full object-cover inset-0 z-0">
    <div class="absolute flex bg-white z-40 rounded-lg top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 shadow-lg max-h-screen p-8">
        <div class="flex flex-col w-1/2 space-y-4">
            <p class="text-2xl font-bold">Sign In</p>

             <div class="relative">
                <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 -translate-y-1/2 w-7 h-7" viewBox="0 0 24 24">
                    <path fill="#000" d="M12 4a4 4 0 0 1 4 4a4 4 0 0 1-4 4a4 4 0 0 1-4-4a4 4 0 0 1 4-4m0 10c4.42 0 8 1.79 8 4v2H4v-2c0-2.21 3.58-4 8-4"/>
                </svg>
                <input type="text" placeholder="Enter Username" class="w-full pl-12 border-2 border-gray-400 rounded-md py-3 text-md focus:outline-none focus:border-gray-600">
            </div>

             <div class="relative">
                <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 -translate-y-1/2 w-6 h-6" viewBox="0 0 24 24">
                    <path fill="#000" d="M12 17a2 2 0 0 0 2-2a2 2 0 0 0-2-2a2 2 0 0 0-2 2a2 2 0 0 0 2 2m6-9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2h1V6a5 5 0 0 1 5-5a5 5 0 0 1 5 5v2zm-6-5a3 3 0 0 0-3 3v2h6V6a3 3 0 0 0-3-3"/>
                </svg>
                <input type="password" placeholder="Enter Password" class="w-full pl-12 border-2 border-gray-400 rounded-md py-3 text-md focus:outline-none focus:border-gray-600">
            </div>

            <label class="flex items-center">
                <input type="checkbox" class="mr-4">
                <span>Remember me</span>
            </label>

            
            <app-button label="Login" variant="login"></app-button>

            <div>
            <p class="flex mt-6">Or, Login with 
                <span class="flex space-x-4 ml-2">
                    <a href="https://www.facebook.com" target="_blank"><img src="/assets/images/facebook.png"></a>
                    <a href="https://www.google.com" target="_blank"><img src="/assets/images/google.png"></a>
                    <a href="https://x.com" target="_blank"><img src="/assets/images/x.png"></a>
                </span>
            </p>
            <p>Don't have an account <a routerLink="/sign-up" class="text-blue-500 hover:cursor-pointer">Create One</a></p>
            </div>
        </div>

        <div class="w-1/2 mr-8 mt-12">
            <img src="/assets/images/signIn.png" alt="Sign In Image">
        </div>
    </div>
</div>
