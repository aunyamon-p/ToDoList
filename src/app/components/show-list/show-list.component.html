<div class="flex flex-col border-[1px] mt-10 ml-16 mr-4 px-8 py-4 border-[#A1A3AB] rounded-xl bg-white h-[calc(100vh-120px)] overflow-y-auto">
    <div class="flex justify-between">
        <div class="flex items-center  mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                <path fill="#A1A3AB" d="M17.385 21q-1.672 0-2.836-1.164Q13.385 18.67 13.385 17t1.164-2.835T17.384 13q1.672 0 2.836 1.165q1.165 1.164 1.165 2.835t-1.165 2.836T17.385 21m.384-4.165V14.5q0-.154-.115-.27q-.116-.114-.27-.114q-.153 0-.269.115q-.115.115-.115.269v2.333q0 .153.056.297q.055.143.186.274l1.525 1.525q.112.111.264.121t.282-.121t.131-.273t-.13-.273zM5.616 20q-.667 0-1.141-.475T4 18.386V5.615q0-.666.475-1.14T5.615 4h4.637q.14-.586.623-.985q.483-.4 1.125-.4q.654 0 1.134.4q.48.398.62.985h4.63q.667 0 1.142.475T20 5.615v4.808q0 .213-.144.356t-.357.144t-.356-.144t-.143-.356V5.616q0-.231-.192-.424T18.384 5H16v1.423q0 .343-.23.576t-.57.232H8.8q-.34 0-.57-.232T8 6.423V5H5.616q-.231 0-.424.192T5 5.616v12.769q0 .269.173.442t.443.173h5.826q.213 0 .357.144t.143.357t-.143.356t-.357.143zm6.387-14.77q.345 0 .575-.232q.23-.233.23-.578t-.233-.575t-.578-.23t-.575.234t-.23.578t.234.574t.577.23"/>
            </svg>
            <div class="ml-2">
                <h1 class="font-bold">My Tasks</h1>
                <div class="h-1 w-8 bg-red-400"></div>
            </div>
        </div>
        <button class="flex items-center" (click)="onAddClick()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" class="fill-[#F24E1E]" viewBox="0 0 24 24">
                <path d="M11 13H6q-.425 0-.712-.288T5 12t.288-.712T6 11h5V6q0-.425.288-.712T12 5t.713.288T13 6v5h5q.425 0 .713.288T19 12t-.288.713T18 13h-5v5q0 .425-.288.713T12 19t-.712-.288T11 18z"/>
            </svg>
            <span class="text-[#A1A3AB] text-sm">Add Task</span>
        </button>
    </div>

    <div class="flex flex-col space-y-2 h-auto" *ngFor="let task of mytasks">
        <button class="border-[1px] border-[#A1A3AB] rounded-xl my-2 p-4" (click)="onTaskClick(task)">
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <div class="flex items-center">
                        <div 
                        [ngClass]="{'bg-red-400' : task.status === 'todo',
                                    'bg-[#0225FF]' : task.status === 'inprogress',
                                    'bg-[#05A301]' : task.status === 'done'}"
                        class="w-3 h-3 rounded-full"></div>
                        <p class="font-bold ml-2 text-start">{{task.title}}</p>
                    </div>
                    <div class="flex space-x-1">
                        <div class="w-2 h-2 rounded-full border-[2px] border-[#A1A3AB]"></div>
                        <div class="w-2 h-2 rounded-full border-[2px] border-[#A1A3AB]"></div>
                        <div class="w-2 h-2 rounded-full border-[2px] border-[#A1A3AB]"></div>
                    </div>
                </div>
                <div class="flex justify-between w-full h-auto">
                    <div class="w-2/3">
                    <p class="pl-6 pr-3 text-start text-sm text-[#A1A3AB] line-clamp-3 whitespace-pre-line">
                        {{ task.description }}
                    </p>
                    </div>                    
                    <div class="h-20 border-none rounded-xl overflow-hidden w-1/3" [ngClass]="{'hidden' : !task.image }">
                        <img *ngIf="task.image" [src]="task.image" class="w-full h-full object-cover " alt="task image">
                    </div>
                </div>
                <div class="flex justify-between text-xs">
                    <div class="flex pl-6">
                        <p class="mr-4">Priority : 
                        <span
                        [ngClass]="{'text-[#e24242]' : task.priority === 'extreme',
                                    'text-[#42ADE2]' : task.priority === 'moderate',
                                    'text-[#5b851c]' : task.priority === 'low'}"
                        >{{task.priority}}</span></p>
                        <p>Status : 
                        <span 
                        [ngClass]="{'text-red-400' : task.status === 'todo',
                                    'text-[#0225FF]' : task.status === 'inprogress',
                                    'text-[#05A301]' : task.status === 'done'}"
                        >{{task.status}}</span></p>
                    </div>
                    <p class="text-[#A1A3AB]">Due date : <span class="font-bold">{{task.date}}</span></p>
                </div>
            </div>
        </button>
    </div>
</div>
