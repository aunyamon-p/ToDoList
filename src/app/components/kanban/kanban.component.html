<div class="flex w-full">
    <div (dragover)="onDragOver($event)" (drop)="onDrop($event , 'todo')" class="px-8 py-4 mr-6 w-1/3 mt-10 ml-16 border-[1px] border-[#A1A3AB] rounded-xl bg-white h-[calc(100vh-120px)] overflow-y-auto">
        <div class="mb-4">
            <h1 class="font-bold">To do</h1>
            <div class="h-1 w-8 bg-red-400"></div>
        </div>
        <div *ngFor="let task of todoTasks" draggable="true" (dragstart)="onDragStart($event , task)" class="flex flex-col space-y-2">
            <button (click)="onTaskClick(task)" class="border-[1px] border-[#A1A3AB] rounded-xl my-2 p-4">
            <div class="space-y-2">
                <div class="flex justify-between items-center space-x-2">
                    <div class="flex items-center">
                        <div class="w-3 h-3 rounded-full bg-red-400"></div>
                        <p class="font-bold ml-2 text-start">{{task.title}}</p>
                    </div>
                    <div class="flex space-x-1">
                        <div class="w-2 h-2 rounded-full border-[2px] border-[#A1A3AB]"></div>
                        <div class="w-2 h-2 rounded-full border-[2px] border-[#A1A3AB]"></div>
                        <div class="w-2 h-2 rounded-full border-[2px] border-[#A1A3AB]"></div>
                    </div>
                </div>
                <p class="text-[#A1A3AB] text-xs text-start pl-6">Due date : <span class="font-bold">{{task.date}}</span></p>
                <div class="flex w-full h-auto">
                    <p class="pl-6 pr-3 text-start text-sm text-[#A1A3AB] w-full line-clamp-1 text-ellipsis whitespace-pre-line">{{task.description}}</p>
                </div>
                <div class="flex pl-6 text-xs">
                    <p class="mr-4">Priority : <span
                        [ngClass]="{'text-[#e24242]' : task.priority === 'extreme',
                                    'text-[#42ADE2]' : task.priority === 'moderate',
                                    'text-[#5b851c]' : task.priority === 'low'}"
                        >{{task.priority}}</span></p>
                    <p>Status : <span
                        [ngClass]="{'text-red-400' : task.status === 'todo',
                                    'text-[#0225FF]' : task.status === 'inprogress',
                                    'text-[#05A301]' : task.status === 'done'}"
                        >{{task.status}}</span></p>
                </div>
            </div>
            </button>
        </div>
    </div>

     <div (dragover)="onDragOver($event)" (drop)="onDrop($event , 'inprogress')" class="px-8 py-4 mr-6 w-1/3 mt-10 border-[1px] border-[#A1A3AB] rounded-xl bg-white h-[calc(100vh-120px)] overflow-y-auto">
